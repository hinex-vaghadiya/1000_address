<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000 Address — Society Map</title>
    <meta name="description" content="Interactive 2D and 3D map visualization of student distribution across societies">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/map.css">
    <!-- Leaflet.js for 2D Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Deck.gl + MapLibre for 3D Map -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
</head>

<body>
    <div class="map-page">
        <!-- Top Bar -->
        <div class="map-topbar">
            <div class="topbar-left">
                <div class="brand">📋 1000 Address</div>
                <a href="/user" class="btn-back" id="backBtn">← Dashboard</a>
            </div>
            <div class="topbar-right">
                <div class="view-toggle" id="viewToggle">
                    <button class="active" data-view="2d" id="btn2d">🗺️ 2D Map</button>
                    <button data-view="3d" id="btn3d">🏙️ 3D Map</button>
                </div>
                <span class="user-badge" id="userBadge" style="padding:6px 14px;background:var(--bg-card);border:1px solid var(--border-glass);border-radius:20px;font-size:0.8rem;color:var(--text-secondary);">—</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="map-content">
            <!-- Sidebar -->
            <div class="map-sidebar" id="mapSidebar">
                <div class="sidebar-header">
                    <h3>📊 Society Stats</h3>
                    <div class="sidebar-stats">
                        <div class="sidebar-stat">
                            <div class="stat-num" id="totalSocieties">0</div>
                            <div class="stat-lbl">Societies</div>
                        </div>
                        <div class="sidebar-stat">
                            <div class="stat-num" id="totalStudents">0</div>
                            <div class="stat-lbl">Students</div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-filter">
                    <label for="areaFilter">Filter by Area</label>
                    <select id="areaFilter">
                        <option value="all">All Areas</option>
                        <option value="MV">MV — Mota Varachha</option>
                        <option value="AB">AB</option>
                        <option value="HB">HB — Hirabag</option>
                    </select>
                </div>

                <div class="sidebar-list" id="societyList">
                    <div class="map-empty-state" style="position:relative;transform:none;top:auto;left:auto;">
                        <div class="icon">⏳</div>
                        <p>Loading societies...</p>
                    </div>
                </div>
            </div>

            <!-- Map -->
            <div class="map-container">
                <div id="map2d"></div>
                <div id="map3d"></div>

                <!-- Legend -->
                <div class="map-legend" id="mapLegend">
                    <h4>Student Count</h4>
                    <div class="legend-item">
                        <div class="legend-dot" style="background:#20d997;"></div>
                        <span>1 – 3 students</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background:#f5c542;"></div>
                        <span>4 – 7 students</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background:#ff8c42;"></div>
                        <span>8 – 12 students</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background:#ff4d6a;"></div>
                        <span>13+ students</span>
                    </div>
                    <div class="legend-item" style="margin-top:8px;border-top:1px solid var(--border-glass);padding-top:8px;">
                        <div class="legend-dot" style="background:var(--accent-1);box-shadow:0 0 8px var(--accent-1);"></div>
                        <span>Your Organization</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile sidebar toggle -->
        <button class="sidebar-toggle" id="sidebarToggle">📊 Stats</button>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
    </div>

    <!-- 3D Tooltip -->
    <div class="deck-tooltip" id="deckTooltip" style="display:none;"></div>

    <script>
        // === Branch coordinates ===
        const BRANCH_COORDS = {
            'MV': { lat: 21.2369993, lng: 72.8772973, label: 'English Pathshala — Mota Varachha' },
            'AB': { lat: 21.2476122, lng: 72.8906912, label: 'English Pathshala — AB' },
            'HB': { lat: 21.2135094, lng: 72.8601451, label: 'English Pathshala — Hirabag' },
            'default': { lat: 21.2370, lng: 72.8773, label: 'English Pathshala' }
        };

        let currentUser = null;
        let mapData = [];
        let leafletMap = null;
        let markersGroup = null;
        let deckOverlay = null;
        let orgMarker = null;
        let currentView = '2d';

        // === Auth ===
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (!data.user) {
                    window.location.href = '/';
                    return;
                }
                currentUser = data.user;
                document.getElementById('userBadge').textContent = currentUser.username + ' • ' + currentUser.user_branch;

                // Set back button based on role
                if (currentUser.role === 'admin') {
                    document.getElementById('backBtn').href = '/admin';
                }
            } catch {
                window.location.href = '/';
            }
        }

        // === Get org coordinates ===
        function getOrgCoords() {
            if (!currentUser) return BRANCH_COORDS['default'];
            const branch = (currentUser.user_branch || '').toUpperCase();
            return BRANCH_COORDS[branch] || BRANCH_COORDS['default'];
        }

        // === Color by student count ===
        function getColor(count) {
            if (count >= 13) return '#ff4d6a';
            if (count >= 8) return '#ff8c42';
            if (count >= 4) return '#f5c542';
            return '#20d997';
        }

        function getColorRGB(count) {
            if (count >= 13) return [255, 77, 106];
            if (count >= 8) return [255, 140, 66];
            if (count >= 4) return [245, 197, 66];
            return [32, 217, 151];
        }

        // === Radius by student count ===
        function getRadius(count) {
            return Math.max(8, Math.min(30, 6 + count * 3));
        }

        // === Load map data ===
        async function loadMapData() {
            try {
                const res = await fetch('/api/societies/map-data');
                mapData = await res.json();
                return mapData;
            } catch {
                return [];
            }
        }

        // === Init 2D Map (Leaflet) ===
        function init2DMap() {
            const org = getOrgCoords();

            leafletMap = L.map('map2d', {
                zoomControl: true,
                attributionControl: true
            }).setView([org.lat, org.lng], 14);

            // Dark tile layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(leafletMap);

            markersGroup = L.featureGroup().addTo(leafletMap);

            // Org marker
            const orgIcon = L.divIcon({
                className: 'org-marker-icon',
                html: `<div style="
                    width: 40px; height: 40px;
                    background: linear-gradient(135deg, #6c63ff, #ff6b9d);
                    border-radius: 50%;
                    display: flex; align-items: center; justify-content: center;
                    font-size: 18px;
                    box-shadow: 0 0 20px rgba(108,99,255,0.6), 0 0 40px rgba(108,99,255,0.3);
                    border: 3px solid rgba(255,255,255,0.3);
                    animation: pulse-org 2s ease-in-out infinite;
                ">⭐</div>
                <style>
                    @keyframes pulse-org {
                        0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(108,99,255,0.6); }
                        50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(108,99,255,0.8); }
                    }
                </style>`,
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });

            orgMarker = L.marker([org.lat, org.lng], { icon: orgIcon })
                .bindPopup(`
                    <div class="popup-title">⭐ ${org.label}</div>
                    <div class="popup-address">Your Organization</div>
                `)
                .addTo(leafletMap);
        }

        // === Render 2D Markers ===
        function render2DMarkers(data) {
            markersGroup.clearLayers();

            if (data.length === 0) return;

            data.forEach(soc => {
                const radius = getRadius(soc.studentCount);
                const color = getColor(soc.studentCount);

                const circle = L.circleMarker([soc.latitude, soc.longitude], {
                    radius: radius,
                    fillColor: color,
                    color: color,
                    weight: 2,
                    opacity: 0.8,
                    fillOpacity: 0.5
                });

                circle.bindPopup(`
                    <div class="popup-title">${escapeHtml(soc.name)}</div>
                    <div class="popup-address">${escapeHtml(soc.address)}</div>
                    <div class="popup-count" style="background:${color};">
                        👨‍🎓 ${soc.studentCount} student${soc.studentCount !== 1 ? 's' : ''}
                    </div>
                `);

                circle.on('mouseover', function() { this.openPopup(); });

                markersGroup.addLayer(circle);
            });

            // Fit bounds
            const org = getOrgCoords();
            const bounds = markersGroup.getBounds();
            bounds.extend([org.lat, org.lng]);
            leafletMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
        }

        // === Init 3D Map (Deck.gl) ===
        function init3DMap(data) {
            const org = getOrgCoords();
            const container = document.getElementById('map3d');
            container.innerHTML = '';

            const maxCount = Math.max(1, ...data.map(d => d.studentCount));

            const columnLayer = new deck.ColumnLayer({
                id: 'society-columns',
                data: data,
                diskResolution: 12,
                radius: 50,
                extruded: true,
                elevationScale: 100,
                getPosition: d => [d.longitude, d.latitude],
                getFillColor: d => [...getColorRGB(d.studentCount), 200],
                getElevation: d => Math.max(1, d.studentCount) * 50,
                pickable: true,
                autoHighlight: true,
                highlightColor: [108, 99, 255, 150],
                onHover: info => {
                    const tooltip = document.getElementById('deckTooltip');
                    if (info.object) {
                        tooltip.style.display = 'block';
                        tooltip.style.left = info.x + 12 + 'px';
                        tooltip.style.top = info.y + 12 + 'px';
                        tooltip.innerHTML = `
                            <div class="tt-name">${escapeHtml(info.object.name)}</div>
                            <div class="tt-count">👨‍🎓 ${info.object.studentCount} student${info.object.studentCount !== 1 ? 's' : ''}</div>
                        `;
                    } else {
                        tooltip.style.display = 'none';
                    }
                }
            });

            // Org marker as a scatterplot
            const orgLayer = new deck.ScatterplotLayer({
                id: 'org-marker',
                data: [{ position: [org.lng, org.lat], label: org.label }],
                getPosition: d => d.position,
                getRadius: 80,
                getFillColor: [108, 99, 255, 220],
                getLineColor: [255, 255, 255, 150],
                getLineWidth: 3,
                lineWidthMinPixels: 2,
                stroked: true,
                pickable: true,
                onHover: info => {
                    const tooltip = document.getElementById('deckTooltip');
                    if (info.object) {
                        tooltip.style.display = 'block';
                        tooltip.style.left = info.x + 12 + 'px';
                        tooltip.style.top = info.y + 12 + 'px';
                        tooltip.innerHTML = `<div class="tt-name">⭐ ${escapeHtml(info.object.label)}</div><div class="tt-count">Your Organization</div>`;
                    } else {
                        tooltip.style.display = 'none';
                    }
                }
            });

            deckOverlay = new deck.DeckGL({
                container: 'map3d',
                mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                initialViewState: {
                    longitude: org.lng,
                    latitude: org.lat,
                    zoom: 13,
                    pitch: 55,
                    bearing: -20
                },
                controller: true,
                layers: [columnLayer, orgLayer]
            });
        }

        // === Render sidebar list ===
        function renderSidebar(data) {
            const list = document.getElementById('societyList');
            const totalStudents = data.reduce((sum, s) => sum + s.studentCount, 0);

            document.getElementById('totalSocieties').textContent = data.length;
            document.getElementById('totalStudents').textContent = totalStudents;

            if (data.length === 0) {
                list.innerHTML = `
                    <div style="text-align:center;padding:30px 10px;color:var(--text-muted);">
                        <div style="font-size:2.5rem;margin-bottom:10px;">📍</div>
                        <p>No societies with coordinates found.</p>
                        <p style="font-size:0.75rem;margin-top:8px;">Add societies with the place search on the Dashboard.</p>
                    </div>`;
                return;
            }

            // Sort by student count desc
            const sorted = [...data].sort((a, b) => b.studentCount - a.studentCount);

            list.innerHTML = sorted.map((soc, i) => `
                <div class="society-item" data-id="${soc._id}" onclick="focusSociety('${soc._id}')">
                    <div class="society-count-badge" style="background:${getColor(soc.studentCount)};">
                        ${soc.studentCount}
                    </div>
                    <div class="society-item-info">
                        <div class="society-item-name">${escapeHtml(soc.name)}</div>
                        <div class="society-item-addr">${escapeHtml(soc.address)}</div>
                    </div>
                </div>
            `).join('');
        }

        // === Focus on a society ===
        function focusSociety(id) {
            const soc = mapData.find(s => s._id === id);
            if (!soc) return;

            // Highlight sidebar item
            document.querySelectorAll('.society-item').forEach(el => el.classList.remove('active'));
            const item = document.querySelector(`.society-item[data-id="${id}"]`);
            if (item) item.classList.add('active');

            if (currentView === '2d') {
                leafletMap.setView([soc.latitude, soc.longitude], 16);
                // Open popup
                markersGroup.eachLayer(layer => {
                    const latlng = layer.getLatLng();
                    if (Math.abs(latlng.lat - soc.latitude) < 0.0001 && Math.abs(latlng.lng - soc.longitude) < 0.0001) {
                        layer.openPopup();
                    }
                });
            } else if (deckOverlay) {
                deckOverlay.setProps({
                    initialViewState: {
                        longitude: soc.longitude,
                        latitude: soc.latitude,
                        zoom: 16,
                        pitch: 55,
                        bearing: -20,
                        transitionDuration: 1000
                    }
                });
            }

            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('mapSidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            }
        }

        // === View toggle ===
        document.getElementById('btn2d').addEventListener('click', () => switchView('2d'));
        document.getElementById('btn3d').addEventListener('click', () => switchView('3d'));

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('#viewToggle button').forEach(b => b.classList.remove('active'));
            document.querySelector(`#viewToggle button[data-view="${view}"]`).classList.add('active');

            const map2d = document.getElementById('map2d');
            const map3d = document.getElementById('map3d');

            if (view === '2d') {
                map2d.classList.remove('hidden-map');
                map3d.classList.remove('active');
                map3d.style.display = 'none';
                setTimeout(() => leafletMap.invalidateSize(), 100);
            } else {
                map2d.classList.add('hidden-map');
                map3d.style.display = 'block';
                map3d.classList.add('active');
                // Re-init 3D if needed
                const filtered = getFilteredData();
                init3DMap(filtered);
            }
        }

        // === Area filter ===
        function getFilteredData() {
            // Filter is not by society area, but we show all societies
            // The area filter could filter by proximity or we just return all
            return mapData;
        }

        document.getElementById('areaFilter').addEventListener('change', function() {
            const area = this.value;
            if (area === 'all') {
                renderSidebar(mapData);
                render2DMarkers(mapData);
                if (currentView === '3d') init3DMap(mapData);
                // Reset to org location
                const org = getOrgCoords();
                leafletMap.setView([org.lat, org.lng], 14);
            } else {
                // Center on the selected branch
                const coords = BRANCH_COORDS[area] || BRANCH_COORDS['default'];
                leafletMap.setView([coords.lat, coords.lng], 15);
                renderSidebar(mapData);
                render2DMarkers(mapData);
                if (currentView === '3d') init3DMap(mapData);
            }
        });

        // === Mobile sidebar ===
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.getElementById('mapSidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        });

        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('mapSidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });

        // === Utility ===
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // === Init ===
        (async () => {
            await checkAuth();
            init2DMap();
            const data = await loadMapData();
            render2DMarkers(data);
            renderSidebar(data);
        })();
    </script>
</body>

</html>
